timing_assumptions:
- READY/CLEARED = 11-hop delay chain (~58 ms) after the reset trigger; must exceed
  reset settling (~21 ms, 4 pulses) plus member recovery from ~-45 mV total inhibition
- 'edge relays: relay fires ~2.5 ms after the source''s first spike, its inhibitor''s
  pulse lands ~5.3 ms after; ordering margin ~2.8 ms nominal'
- loads (upstream DATA) arrive only after READY
notes:
- four-phase dual-rail word transport, producer register -> consumer register with
  completion tree
- 'campaign: 10^6 transactions at mix B, 0 wrong values consumed (95 % upper limit
  3.0e-6); 22 non-ok (observed 2.2e-5, upper limit 3.1e-5): 3 raised neurally (fault
  latch), 19 noticed by the harness only (no neural timeout yet)'
- 'status: M1 closed for functional correctness and safety; liveness/availability
  defect carried into A2/B; contract not frozen until the watchdog, stale-state detection
  and the adder composition campaign land'
