timing_assumptions:
- READY/CLEARED = 11-hop delay chain (~58 ms) after the reset trigger; must exceed
  reset settling (~21 ms, 4 pulses) plus member recovery from ~-45 mV total inhibition
- 'edge relays: relay fires ~2.5 ms after the source''s first spike, its inhibitor''s
  pulse lands ~5.3 ms after; ordering margin ~2.8 ms nominal'
- loads (upstream DATA) arrive only after READY
notes:
- four-phase dual-rail word transport, producer register -> consumer register with
  completion tree, producer watchdog (55 hops ~ 290 ms) raising FAULT-ACCEPT on timeout
- 'final build: AND input fraction 0.65, fault gates 0.55, ignition 1.8x need (doublet-free),
  READY chain 15 hops (~80 ms)'
- 'liveness: a transaction that never completes is refused neurally (TIMEOUT latch
  -> FAULT-ACCEPT); stale state after a reset is harness-observed only (monitor rejected
  on measurement, docs/a2_liveness.md)'
- 'status: contract frozen for A2/B pending the 1e5 adder composition campaign on
  the same build'
