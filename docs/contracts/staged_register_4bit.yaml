timing_assumptions:
- READY = 15-hop delay chain (~80 ms) after a reset trigger; must exceed reset settling
  (~21 ms) plus member recovery
- 'veto relays: a veto rail is live >= 15 ms before its driver rises (by construction,
  see docs/a2_alu_register.md section 2.4)'
- 'relay recovery budget: hold interneuron ~40 ms, veto ~55 ms, source inhibition
  ~86 ms, against gaps of >= 85, >= 155, >= 170 ms'
- COMMIT is issued at most once per transaction, any time after DATA; readers sample
  the master only while W_M holds
- loads (upstream DATA) arrive only after READY
notes:
- 'word register with staged commit: stage (channel consumer) + master with completion;
  COMMIT token; veto-relay copy'
- 'retention: the stage held a word 2 s under the clean model before commit (tests/test_register.py);
  maximum supported hold is not bounded by the model (self-sustaining loops) and is
  set by the one-input exposure of the stage''s fault gates (0.55 x 2)'
- commit latency (grant -> W_M) ~247 ms; READY ~93 ms after commit-done
