primitive: flipflop_latch
profile: 3
model:
  dt_ms: 0.1
  tau_m_ms: 20.0
  tau_s_ms: 5.0
  delay_ms: 1.8
  w_syn_mv: 0.275
  t_ref_ms: 2.2
drive_quanta:
  single_need: 2586.0434707264194
  rate_need: 382.8363636363636
  loop: 3621
  pulse: 3621
  reset: -5432
  loop_period_steps: 47
  ignite: 4655
design:
  members: 2 inhibitory neurons u (fires while SET) and v (fires while CLEAR)
  bias_mv_per_member: 58.0
  mutual_inhibition_quanta_per_spike: 3621  # 1.0x loop, each direction
  bistable_from_quanta: 2900                # 0.8x loop holds; 0.75x does not (silent member escapes, both fire ~123 Hz)
  parked_member_mv_below_threshold: ~15     # mean, at 1.0x loop; ripple ~1 mV
resources:                                  # the bare pair; the proxy readout adds 1 neuron / 1 synapse (proxy_readout below)
  neurons: 2
  synapses: 2
  excitatory_synapses: 0
  inhibitory_synapses: 2
  total_abs_quanta: 7242
  biased_neurons: 2
  set_chain_adapter_neurons: 4              # add_set_chain: one ignite pulse -> four into u (SET_TRAIN_PULSES; three until 2026-09-16, see lockstep below)
  clear_chain_neurons: 4                    # add_clear_chain, shareable across flip-flops
tonic_rate_vs_bias_hz:                      # lone biased neuron, RefSim, 400 ms
  7.5: 17.5
  8: 22.5
  10: 40.0
  20: 92.5
  40: 165.0
  50: 192.5
  55: 205.0
  58: 212.5                                 # period 47 steps: the excitatory latch's loop period exactly
  60: 217.5
  65: 227.5
  70: 232.5
  80: 250.0
activity:
  member_rate_hz_while_holding: 212.8
  isi_steps_while_holding: 47
  rate_hz_first_50ms_after_set: 200-220 (train) / 220 (single 3x pulse)
  first_isi_after_set_ms: 3.7-4.8 (no doublet)
  duty_cycle: one member fires continuously in EITHER state (SET and CLEAR cost the same)
switching:                                  # all-phase minima: every one of the 47 phases of the running member
  set_single_pulse_into_u_min: 2.25x ignite (10474 quanta); 2.0x switches 36 % of phases; 1.0x (the latch's ignition) 0 %
  set_train_into_u_min: 3 x 0.75 ignite, 53 steps apart; 2 x 1.25 ignite; 4 x 0.6 ignite
  set_pair_min: 1.5x ignite into u + 1.5x loop into v at the same step
  clear_single_pulse_into_u_min: 4.0x loop (14484 quanta); 3.0x switches 71 %
  clear_train_into_u_min: 3 x 1.0 loop, 53 steps apart; 2 x 1.5 loop; 4 x 0.75 loop (the standard reset train, 0.7 switches 75 %)
  clear_pair_min: 1.5x loop into u + 1.5x ignite into v at the same step
  defaults:
    set_pulse: 4 x 1.0 ignite, 53 steps apart (or one 3x ignite pulse); 3 x 1.0 until 2026-09-16 (lockstep below)
    clear_pulse: 3 x drive.reset (-1.5x loop), 53 steps apart (or one 5x loop pulse)
  switching_time_ms:
    set_train: u's first spike 6.0-6.4 after the first pulse (the second pulse fires it); v's last spike <= 12.6; identical for 3 and 4 pulses at all 47 phases
    set_single: u's first spike 1.4-1.7; v's last spike <= 6.8
    clear: u stops at once (no spike after the first pulse lands); v's first spike 9.4-14.0
hold:
  both_states_ms: 2000 with no input, 425 spikes each (212.5 Hz), RefSim
power_on:
  without_a_pulse: both members fire together from 2.5 ms on and stay in LOCKSTEP (~105 Hz each at 1.0x loop), a stable third state; an edge relay on u then fires spuriously at 4.9 ms
  power_on_pulse: one 1.0x loop inhibitory pulse into u at step 0 -> CLEAR, u never fires
  lockstep_recovery: a clear train into u (3 x 1.0 loop) resolves lockstep to CLEAR
noise_margin:                               # largest single stray pulse that never flips it, all 47 phases
  stray_excitatory_into_silent_member: 1.8x ignite (8379 quanta, ~22.7 mV); 1.9x flips 8 %, 2.0x 33 %
  stray_inhibitory_into_firing_member: 2.25x loop (8147 quanta); 2.5x flips 38 %, 3.0x 71 %
  excitatory_latch_for_comparison:
    stray_excitatory_into_silent_latch: ignites at 1.1x need (2845 quanta, ~7.7 mV); 1.0x does not
    stray_inhibitory_into_one_member: survives 2.0x loop; 3.0x kills 79 % of phases
primitive_compatibility:                    # measured directly, RefSim
  add_edge_relay_on_u: fires exactly once per SET, ~4.5 ms after u's first spike, never on the tonic train (3 of 3 cycles); fires once at power-on if the power-on pulse is omitted
  add_veto_relay_with_u_as_veto: holds the relay and target while SET; a re-drive 50 ms after CLEAR fires the relay and ignites the target, 40 ms does not (the 55 ms rule holds; u stops at once on CLEAR)
  add_veto_relay_target_or_celement_ignite_from: DOES NOT WORK - their single ignite pulse into .u never sets it (0 of 47 phases); route the pulse through add_set_chain instead
  add_reset_on_members: DOES NOT WORK - a train into both members (4 x 0.75 or 3 x 1.5 loop) leaves the flip-flop where it was (SET stays SET, 12 of 12); add_clear_chain aims the same train at u only
  kill_train_into_u: 3 x 1.0 loop clears at every phase; the standard 4 x 0.75 loop clears too with ~7 % margin
  single_ignition_pulse: does not set it (see above)
  weight_noise: "mix B (lockstep below): 0 of 16,000 SETs and CLEARs lock with the 4-pulse train, 0 of 500 x 2 s holds in either state; the bistability floor is 20-25 % below the default inhibition (5 sigma of the 4 % weight noise)"
proxy_readout:                              # add_flipflop(proxy=True): p, an EXCITATORY neuron, bias 58 mV, inhibited by v
  why: u is inhibitory, so every reader's edge from it (edge relay, veto neuron) is of the wrong sign on any host; p is the sign-correct SET rail (docs/h1_placement.md, Placing flip-flops)
  design:
    p: excitatory, bias 58 mV (BIAS_213HZ_MV), one synapse v -> p of -1.0x loop (3621 quanta); no outputs of its own; no feedback into the pair
    q (clear_proxy=True): the same, inhibited by u; fires while CLEAR
    v_to_p_quanta_sweep:                    # p silent over 2 s of CLEAR? / p's first spike after v's last, ms / p's last spike after the first CLEAR pulse, ms
      0.75x: leaks (p fires through v's train)
      0.8x: silent / 11.0-15.3 / 20.7-25.0
      1.0x: silent / 10.5-14.0 / 10.1-17.8   # default: the pair's own park depth (~15 mV); 25 % above the leak floor
      1.25x: silent / 16.0-19.0 / 8.6-17.6
      1.5x: silent / 20.0-22.9 / 9.2-14.4
      2.0x: silent / 26.0-28.8 / 8.0-15.5
  resources:
    neurons: 3 (4 with q)
    synapses: 3 (4 with q), all inhibitory
    biased_neurons: 3 (4 with q)
  activity:
    p_rate_hz_while_set: 212.9 (isi 47 steps, step for step with u; 426 spikes in 2 s)
    p_spikes_while_clear_2s: 0
    q_rate_hz_while_clear: 212.9
    q_spikes_while_set_2s: 0
    lockstep: in the pair's lockstep third state (no power-on pulse) p and q both fire at ~105 Hz like u and v
  switching_time_ms:                        # all 24 measured phases (every 2nd of 47)
    p_first_spike_after_first_set_pulse: 18.5-23.1 (train) / 13.2-17.8 (single 3x pulse); u's is 6.0-6.4 / 1.4-1.6
    p_first_spike_after_v_last_spike: 10.5-14.0 (the parked neuron climbs 15 mV with tau_m, exactly v's 9.5-14.0 on CLEAR)
    p_last_spike_after_first_clear_pulse: 9.8-17.8 (train) / 10.8-17.0 (single 5x pulse); u stops at once, v's first spike is 9.5-14.0 and p crosses once or twice before the park
    q_first_spike_after_first_clear_pulse: 9.5-14.0 (with v)
    q_last_spike_after_first_set_pulse: 4.5-12.6 (with v)
  power_on:
    without_a_pulse_into_p: p fires once at 2.5 ms (before v's first inhibition lands at 4.3 ms); an edge relay on p fires at 6.7 ms
    power_on_pulse: now [(0, u, -loop), (0, p, -loop)]; power_on_events covers every .p; p never fires, q fires from 2.5 ms (CLEAR)
  noise_margin:
    stray_excitatory_into_p_while_clear: "1.1x ignite (5120 quanta) never fires it, 24/24 phases; 1.15x fires p ONCE at every phase (1.8x: twice), and an edge relay on p fires once on that spike; the pair is untouched (u never fires). The reader's margin is therefore 1.1x ignite, the same number as u's lockstep threshold, with a milder failure (one spurious relay pulse against a permanent lockstep)"
    stray_inhibitory_into_p_while_set: p pauses and resumes at every phase; pause 7.0-8.8 ms at 1.0x loop, 11.4-15.8 at 2.25x (u's margin), 13.9-19.4 at 3.0x; an edge relay on p never re-fires on the pause (0/24 at 1.0-3.0x); a veto relay vetoed by p stays held when its driver rises 0-27 ms after a 3.0x stray (0/10 leaks)
  primitive_compatibility:                  # the table above redone through p
    add_edge_relay_on_p: "fires exactly once per SET (3 of 3 cycles; 47 of 47 phases), 4.2 ms after p's first spike, 22.6-27.3 ms after the first SET pulse over the 47 phases (through u: ~11); never on the tonic train; once at power-on if the pulse into p is omitted"
    add_veto_relay_with_p_as_veto: "holds the relay and target while SET when the SET train leads the driver's rise by >= 22 ms (through u: 10; p rises ~12 ms later); after CLEAR a re-drive 60 ms after the first clear pulse fires the relay and ignites the target, 55 does not (through u: 45 yes, 40 no). Measured from the rail's last spike the 55 ms rule is unchanged (p's last spike is <= 17.8 ms after the clear pulse)"
    add_set_chain_and_add_clear_chain: "unchanged (latch -> edge relay -> chain -> SET; trigger -> clear); p first spike 34 ms after the source ignites (u: ~19.5), p's last spike 25.2 ms after the clear trigger (u: 6.4)"
    kill_train_into_u: 4 x 0.75 loop clears the pair and p follows, last p spike 22.9 ms after the first kill pulse
    what_a_reader_connects_to: ff.p (ff.rail) instead of ff.u; nothing else changes. Writers still target u (set chain) and u only (clear chain)
  cost_summary: +1 neuron, +1 inhibitory synapse and +1 bias per flip-flop; every SET-side reader sees the rail ~12 ms later and every CLEAR-side release ~15 ms later than through u
lockstep:                                   # measured 2026-09-16, TorchSim CPU float64 (== RefSim), bench scripts in the run's scratch; docs/a1_flipflop.md, Lockstep
  what_it_is: both members spike within the synaptic delay (1.8 ms) of each other, so neither inhibition arrives before the other's spike; both are inhibited together, recover together and repeat, period ~96 steps (~105 Hz each; p and q run at the same rate). The synchronous pair is an attractor - a member that spikes late gets the other's inhibition earlier in its own cycle (more of it inside its 2.2 ms refractory hold), recovers sooner and catches up - with a basin of about +-18 steps (the delay) of relative phase
  once_in_it_it_stays:                      # started from power-on with no pulse (both from rest), 1 s
    weights: locked for every (u->v, v->u) in 0.7-1.5x loop within ~0.3x of each other, with and without 5 Hz stray; an asymmetry of >= 0.4x loop resolves it to the side with the stronger inhibition (1.4/1.0 -> SET)
    bias: locked for every v bias 56-70 mV against u at 58 (a bias difference is no symmetry breaker)
    mix_B: "500 perturbed copies with stray: 500 of 500 still locked at 0.1-0.5, 0.5-1.0 and 1.0-2.0 s"
    stray_started: a 1.5x ignite stray into a parked u locks the nominal pair; any asymmetry >= 0.1x loop resolves that one to the stronger side (its phase offset is not zero)
  how_a_set_train_causes_it: u's park is ~15 mV x (v->u / loop); a 1.0x ignite pulse climbs 12.6 mV, so the second pulse fires u at nominal, the third once v->u is ~12 % strong. When u first fires on the last pulse, its next tonic spike (~5 ms later, delayed by v's inhibition landing on it) meets v's recovery spike within 18 steps and the pair is in the basin; every earlier-firing case leaves u leading by more than the delay and v parked
  set_train_margin_in_v_to_u:               # largest v->u (x loop, u->v at 1.0x) at which all 47 phases SET, no lock, no failure, nominal bias and threshold
    3 x 1.0 ignite, 53 steps: 1.10 (1.125 locks 28 % of phases, 1.175-1.2 100 %, >= 1.325 fails to SET)
    3 x 1.0, 47 / 60 / 70 steps: 1.10 (the spacing is not the lever; the pair's 4.7 ms rhythm is not what the train has to match)
    4 x 1.0: 1.25
    5 x 1.0: 1.375
    3 x 1.25: 1.20
    3 x 1.5: 1.30
    4 x 1.25: 1.40
    against u's threshold (-45 to -43.5 mV) or bias (57-59 mV): no lock and no failure for any of the trains
    bias_map: "u and v biases 57.0-59.0 mV in 0.2 mV steps, 47 phases, 3 x 1.0 train: 0 lock, 0 failure everywhere"
    weight_map: "u->v and v->u 0.70-1.30 in 0.05 steps, 47 phases, 3 x 1.0 train: lock only for v->u >= 1.15 (park too deep for the train) and below the bistability floor (u->v <= 0.75, v->u <= 0.95: the parked member escapes); u->v > v->u helps by 2-3x at a given v->u and no more"
  clear_train_margin_in_u_to_v: "3 x 1.5 loop: 1.40 (v->u at 1.0x); 4 x 1.5 loop (the register's reset train): 1.50, the top of the sweep. The clear side had a 40 % margin where the set side had 10 %"
  pair_level_candidates_rejected:
    stronger_symmetric_inhibition: 1.2x loop locks 50 % of mix-B SETs, 1.5x fails to SET at all (the park deepens with the loop and the 3 x 1.0 train does not)
    asymmetry_u_to_v_1.2: 0 SET locks of 8,000 at mix B but 1 CLEAR lock (its CLEAR margin drops to 1.175x), and the SET cliff moves only from 1.10 to 1.125x
    self_inhibition_0.3x: locks half of all switches (it slows both members alike)
    bias_asymmetry: no effect on the lockstep attractor up to +12 mV
  mix_B_fraction:                           # 500 perturbations x 16 random phases, SET and CLEAR twice each through the real set and clear chains (their synapses perturbed too), 5 Hz x 150 q stray
    3_pulse_train_before: 9 / 8,000, 15 / 8,000 and 74 / 16,000 SETs in three draws (0.1-0.5 %; a handful of pairs with v->u ~3 sigma strong lock at a third to all of their phases); 0 / 16,000 CLEARs; 0 / 500 spontaneous over 2 s in SET and 0 / 500 in CLEAR
    4_pulse_train_after: "0 / 16,000 SETs, 0 / 16,000 CLEARs, 0 / 500 + 0 / 500 spontaneous; at 1.5x mix B (6 % weights, 0.3 mV) 0 / 16,000 SETs where 3 pulses lock 589 / 16,000; at 2x mix B 52 / 16,000 SETs lock and 63 fail to SET (3 pulses: 1,169 and 247) - and ~100 / 16,000 CLEARs lock for every SET train (the CLEAR train's own 2x-mix-B limit, unchanged by 4 clear pulses)"
    5_pulse_train: 4 / 16,000 SETs lock and 31 fail at 2x mix B; 0 at mix B and 1.5x; one more relay per set chain
  the_default: "SET_TRAIN_PULSES = 4 (set_pulse and add_set_chain): the switching, hold, rate, margins and proxy timing above are unchanged step for step (measured at all 47 phases); the set chain is 4 neurons instead of 3; the clear train stays 3 x 1.5 loop"
  test: tests/test_flipflop.py::test_500_mix_b_flipflops_set_and_clear_without_lockstep (500 perturbations x 4 phases, bound 2 of 4,000 SETs; measured 0; the 3-pulse train locks 3 of the same 4,000)
timing_assumptions:
- both members must be biased identically (58 mV); a bias difference is not a usable symmetry breaker (lockstep persists up to +10 mV at 1.0x loop; +15 mV resolves it but leaves the v member unparked)
- the switching train's pulses are 53 steps apart (the reset controller's relay hop) and the SET train is four of them (SET_TRAIN_PULSES): three lock a mix-B-perturbed pair in step on 0.1-0.5 % of SETs; a SET source must be one-shot (an edge relay) into add_set_chain
- a veto rail from u is established >= 15 ms before its driver rises, as for a latch; through p the SET train must lead the driver by >= 22 ms
- power-on pulse (or a clear train) before any edge relay on u or p is trusted; the pulse goes into p as well as u
notes:
- bias is a per-neuron Netlist/Topology parameter (Netlist.neuron(bias=), Topology.bias, Topology.sim_bias()); the simulators are given it by the caller
- measured in this run's scratch scripts (RefSim, < 200 neurons, <= 2.1 s each); regression in tests/test_flipflop.py
