timing_assumptions:
- READY = 15-hop delay chain (~80 ms) after a reset trigger; must exceed reset settling
  (~21 ms) plus member recovery
- 'veto relays: a veto rail is live >= 15 ms before its driver rises (by construction,
  see docs/a2_alu_register.md section 2.4)'
- 'relay recovery budget: hold interneuron ~40 ms, veto ~55 ms, source inhibition
  ~86 ms, against gaps of >= 85, >= 155, >= 170 ms'
- a relay is driven >= 55 ms after any of its veto rails dies (the veto's residual
  inhibition)
- relays that feed an edge-detected trigger use the fast inhibitor (doublet-free)
- loads (upstream DATA) arrive only after READY
notes:
- '8 words x 4 bits: word masters (rails, completion, reset, READY) with a veto-relay
  write port (word-select vetoed by the mismatching address rails) and a read port
  into an output register'
- 'clean model: write done ~506 ms after the load, read ~417 ms, cycle ~600 ms; a
  read of an unwritten word ignites both rails of every bit and is refused by the
  read consumer''s fault gates'
- '''accept'' below = done (the word''s completion for a write, the output register''s
  completion for a read)'
