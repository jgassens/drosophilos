delay_jitter_tolerance: 'not measured: per-synapse delays are shared topology in this
  backend'
stray_input_tolerance:
  single_excitatory_pulse_into_parked_rail_u: 1.1x ignite (5,120 q) never changes
    it; >= 1.15x drops the pair into LOCKSTEP (both ~105 Hz) at every phase, healed
    by the next reset; 2.0x SETs it at ~50 % of phases
  single_excitatory_pulse_into_set_trigger: '0.55x ignite (2,560 q, ~1.0x single need)
    never fires it; 0.6x fires the chain and SETs the rail at every phase: the register''s
    stray margin is the trigger''s, the same as a latch''s u (1.1x need)'
  single_inhibitory_pulse_into_a_set_rail_u: 2.25x loop (8,147 q) never clears it;
    2.5x clears 4 of 12 phases, 3.0x 8 of 12
  measured_on: the consumer register alone, RefSim, phases 0..44 step 4 (12 phases)
    unless stated
campaign: null
timing_assumptions:
- READY/CLEARED = 15-hop delay chain (~80 ms) after the reset trigger; must exceed
  reset settling (~21 ms, 4 pulses) plus the flip-flop's u recovery from 4 x 1.5x
  loop of inhibition on top of v's park
- 'edge relays: relay fires ~1.8 ms after the source''s first spike, its inhibitor''s
  pulse lands ~5.3 ms after; a relay re-arms only after ~50 ms of source silence'
- 'SET is a train: data relay -> set trigger -> two relays, three ignite pulses 5.3
  ms apart into u; u''s first spike ~6 ms after the first pulse'
- 'power-on: one loop-strength inhibitory pulse into every flip-flop''s u with the
  image (Channel.power_on_events); without it a pair fires in lockstep for ever'
- loads (upstream DATA) arrive only after READY
notes:
- 4-bit transport channel, consumer rails on flip-flops (storage='flipflop'), flags
  (valid, tree, completion, fault) on latches by measurement, watchdog 55 hops
- 'producer is the latch register: every harness loads it with one ignition pulse
  per rail, which cannot set a flip-flop'
- 'activity counts include the CLEAR-side v members: one member of every flip-flop
  fires at 213 Hz at all times, so an idle register costs 8 x 213 Hz'
- 'status: measured 2026-09-16, not frozen; mix-B campaign pending (cluster)'
