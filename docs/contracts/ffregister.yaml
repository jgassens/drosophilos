  decoded_after_hold: the loaded word, valid
  rate_hz_while_holding: 212.5
  period_steps: 47
  measured_by: tests/test_ffregister.py::test_register_clears_at_every_phase_and_holds_two_seconds
reset_at_every_phase:
  phases: all 47 measured; the fast test checks every second one
  train: 4 x 1.5x loop into u only (the reset controller's inh)
  lockstep_resolved: 'yes: tests/test_ffregister.py::test_stray_lockstep_is_healed_by_the_next_reset'
fan_in_out:
  rail_u_fan_out:
  - 3
  rail_u_fan_out_readers:
  - 3
  set_trigger_fan_in: 1
  reset_inh_fan_out: 33
  fan_out_tolerated: 'unbounded by the model: a presynaptic spike costs the source nothing (no load);
    measured on the real connectome as isolation cost instead (H0)'
error_rate:
