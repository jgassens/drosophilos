timing_assumptions:
- READY/CLEARED = 11-hop delay chain (~58 ms) after the reset trigger; must exceed
  reset settling (~21 ms, 4 pulses) plus member recovery from ~-45 mV total inhibition
- 'edge relays: relay fires ~2.5 ms after the source''s first spike, its inhibitor''s
  pulse lands ~5.3 ms after; ordering margin ~2.8 ms nominal'
- loads (upstream DATA) arrive only after READY
notes:
